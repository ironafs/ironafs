# Test runner settings (coding standards rule 15).
#
# retries = 0 in every profile: a retry that passes hides a determinism
# bug. A --retries option or NEXTEST_RETRIES overrides this, so acceptance
# runs pass --retries 0 explicitly. CI selects --profile ci.
# slow-timeout terminates instead of only warning: a deadlocked test
# otherwise shows up as a job that never ends while the runner keeps
# printing SLOW. A suite that needs longer gets its own override with the
# reason, never a global increase.

[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = true

[profile.ci]
retries = 0
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

# The inventory check (cargo xtask inventory) reads this run's JUnit report
# to see which tests ran and passed.
[profile.ci.junit]
path = "junit.xml"
