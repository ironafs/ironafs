# ironafs-time's own clippy configuration. Clippy reads the nearest
# clippy.toml whole, so this file is the root one with exactly the two
# Deadline constructor bans left out: inside ironafs-time the path
# `ironafs_time::Deadline::...` names nothing (clippy would warn that it
# does not refer to a reachable function), and the constructors are defined
# and tested here. `cargo xtask check-bans` fails if the two files differ in
# anything else, and `cargo xtask check-seams` allows the constructors'
# names in this crate only where they are defined.

# The workspace denies unwrap/expect/panic/indexing (Cargo.toml). Tests may
# use them: a test that panics is a failing test, not a crash on bad input.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Proper nouns that pedantic's doc_markdown would otherwise ask to backtick.
doc-valid-idents = ["IronAFS", "OpenAFS", "AuriStor", "FSKit", "macOS", ".."]

# Coding standards rule 7: time and randomness come only through the Clock
# and Rng interfaces of ironafs-time. One entry per line, written as
# `path = "..."`: `cargo xtask check-bans` reads them so and proves each
# fires on planted code.
#
# The hashed collections and their hasher are banned as types, since a map
# built with `new`, `default`, `from` or `collect` seeds its hasher from the
# operating system through no method a method ban can see; use a BTreeMap,
# or a hasher seeded through Rng under a named expect. A subprocess can read
# the host's clock or randomness, so Command is banned; the one exemption
# is xtask, repository automation that is never shipped, by one item-level
# expect on its own Command alias, so every other ban still applies there.
#
# Kept elsewhere: the core's waits with a timeout, sleeps and threads
# (check-deps on ironafs-client), and everything the standard library
# offers, in the pure crates (check-pure).
#
# The two Deadline constructors are banned too, as the seams
# specification's second net (5.3, point 2): a deadline is built only in a
# crate's one named sampling function, which carries the one allowance, and
# `cargo xtask check-seams` checks where. ironafs-time's own clippy.toml is
# this file without those two bans.
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "coding standards rule 7: read time through the Clock interface of ironafs-time" },
  { path = "std::time::Instant::elapsed", reason = "coding standards rule 7: elapsed reads the system clock; read time through the Clock interface of ironafs-time" },
  { path = "std::time::SystemTime::now", reason = "coding standards rule 7: read wall time through the Clock interface of ironafs-time" },
  { path = "std::time::SystemTime::elapsed", reason = "coding standards rule 7: elapsed reads the system clock; read wall time through the Clock interface of ironafs-time" },
]
disallowed-types = [
  { path = "std::hash::RandomState", reason = "coding standards rule 7: a random hasher state draws from the operating system; draw randomness through the Rng interface of ironafs-time" },
  { path = "std::collections::HashMap", reason = "coding standards rule 7: its default hasher draws from the operating system; use a BTreeMap or a hasher seeded through Rng" },
  { path = "std::collections::HashSet", reason = "coding standards rule 7: its default hasher draws from the operating system; use a BTreeSet or a hasher seeded through Rng" },
  { path = "std::process::Command", reason = "coding standards rule 7: a subprocess can read the host's clock or randomness outside the seam" },
]
