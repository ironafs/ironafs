# Clippy reads the first clippy.toml it finds from the crate upwards, so this
# file repeats the workspace's settings, every ban of coding standards rule 7
# among them (the root clippy.toml says why each is there), and adds this
# crate's own.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
doc-valid-idents = ["IronAFS", "OpenAFS", "AuriStor", "FSKit", "macOS", ".."]

# Every heap request the decoder makes goes through its ledger, and the
# encoder requests its output once (docs/specs/xdr.md, 5.2, point 9.2, and
# 5.5, point 3). These allocate, or may reallocate, outside both. The two
# reservation sites carry the named exceptions; review covers what this
# list misses: `Vec::from` and other conversions through `From`, which
# Clippy cannot name by path without banning `From::from` everywhere.
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "coding standards rule 7: read time through the Clock interface of ironafs-time" },
  { path = "std::time::Instant::elapsed", reason = "coding standards rule 7: elapsed reads the system clock; read time through the Clock interface of ironafs-time" },
  { path = "std::time::SystemTime::now", reason = "coding standards rule 7: read wall time through the Clock interface of ironafs-time" },
  { path = "std::time::SystemTime::elapsed", reason = "coding standards rule 7: elapsed reads the system clock; read wall time through the Clock interface of ironafs-time" },
  { path = "alloc::vec::Vec::with_capacity", reason = "reserve through the decoder's ledger" },
  { path = "alloc::vec::Vec::reserve", reason = "reserve through the decoder's ledger" },
  { path = "alloc::vec::Vec::reserve_exact", reason = "reserve through the decoder's ledger" },
  { path = "alloc::vec::Vec::try_reserve", reason = "reserve through the decoder's ledger" },
  { path = "alloc::vec::Vec::try_reserve_exact", reason = "reserve through the decoder's ledger" },
  { path = "alloc::vec::Vec::extend_from_slice", reason = "may reallocate; fill a reserved buffer by push" },
  { path = "alloc::vec::Vec::extend_from_within", reason = "may reallocate; fill a reserved buffer by push" },
  { path = "alloc::vec::Vec::insert", reason = "may reallocate; fill a reserved buffer by push" },
  { path = "alloc::vec::Vec::append", reason = "may reallocate; fill a reserved buffer by push" },
  { path = "alloc::vec::Vec::resize", reason = "may reallocate; fill a reserved buffer by push" },
  { path = "alloc::vec::Vec::shrink_to_fit", reason = "reallocates outside the ledger" },
  { path = "alloc::vec::Vec::into_boxed_slice", reason = "may reallocate outside the ledger" },
  { path = "core::iter::Extend::extend", reason = "may reallocate; fill a reserved buffer by push" },
  { path = "alloc::vec::Vec::splice", reason = "may reallocate; fill a reserved buffer by push" },
  { path = "core::iter::Iterator::collect", reason = "allocates outside the ledger" },
  { path = "slice::to_vec", reason = "allocates outside the ledger" },
  { path = "slice::repeat", reason = "allocates outside the ledger" },
  { path = "slice::concat", reason = "allocates outside the ledger" },
  { path = "slice::join", reason = "allocates outside the ledger" },
  { path = "alloc::borrow::ToOwned::to_owned", reason = "allocates outside the ledger" },
  { path = "alloc::boxed::Box::new", reason = "allocates outside the ledger" },
  { path = "alloc::string::ToString::to_string", reason = "allocates outside the ledger" },
]
disallowed-types = [
  { path = "std::hash::RandomState", reason = "coding standards rule 7: a random hasher state draws from the operating system; draw randomness through the Rng interface of ironafs-time" },
  { path = "std::collections::HashMap", reason = "coding standards rule 7: its default hasher draws from the operating system; use a BTreeMap or a hasher seeded through Rng" },
  { path = "std::collections::HashSet", reason = "coding standards rule 7: its default hasher draws from the operating system; use a BTreeSet or a hasher seeded through Rng" },
  { path = "std::process::Command", reason = "coding standards rule 7: a subprocess can read the host's clock or randomness outside the seam" },
]
disallowed-macros = [
  { path = "alloc::vec", reason = "allocates outside the ledger" },
  { path = "alloc::format", reason = "allocates outside the ledger" },
]
