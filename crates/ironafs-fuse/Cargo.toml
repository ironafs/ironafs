# The Linux layer (ADR 0004, L2). Its codec is pure: bytes in, values out,
# with no I/O, no clock and no unsafe. No third-party crate (coding
# standards rule 21).
[package]
name = "ironafs-fuse"
description = "IronAFS's Linux layer: its own FUSE protocol codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ironafs-vfs.workspace = true

[dev-dependencies]
ironafs-test-support.workspace = true

