# A pure crate with no dependencies at all (ADR 0004, C4, point 1, and O1,
# point 1): no features, no build script. The test-only crates are
# dev-dependencies, which check-deps leaves out.
[package]
name = "ironafs-events"
description = "IronAFS's event catalogue, redaction, rate limiting, metrics and health, and its log-sink encodings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
ironafs-test-support.workspace = true
ironafs-time.workspace = true

[lints]
workspace = true
