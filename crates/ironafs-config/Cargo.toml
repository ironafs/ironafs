# A pure crate with no dependencies (ADR 0004, C4, point 1): no features,
# no build script. The test support crate is a dev-dependency for the
# property tests in tests/it/.
[package]
name = "ironafs-config"
description = "IronAFS's configuration parser: a strict TOML subset, and the canonical cell name"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
ironafs-test-support.workspace = true

[lints]
workspace = true
