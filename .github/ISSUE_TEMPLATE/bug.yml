name: Bug report
description: Something IronAFS does wrong.
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go to SECURITY.md, never here. Do not paste tokens,
        keytabs, cell names you want kept private, or captures that contain them.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: Commands, configuration and the IronAFS version or commit.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and version, and the AFS server type and version if known.
    validations:
      required: true
