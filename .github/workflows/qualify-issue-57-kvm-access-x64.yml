name: x86-64 hosted KVM access probe

on:
  push:
    branches: [qualify/issue-57-kvm-access-x64]
    paths: [.github/workflows/qualify-issue-57-kvm-access-x64.yml]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Query the KVM API as the runner user
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -sm)" != "Linux x86_64" ]]; then
            printf 'stage=runner-arch status=failed expected=Linux-x86_64\n' >&2
            exit 1
          fi
          printf 'stage=runner-arch status=pass kernel=%s\n' "$(uname -r)"
          timeout -k 2s 10s python3 -I -B - <<'PY'
          import fcntl
          import os
          from pathlib import Path
          import stat
          import sys

          def fail(stage, detail):
              print(f"stage={stage} status=failed {detail}", file=sys.stderr, flush=True)
              raise SystemExit(1)

          # Linux x86-64 UAPI assigns _IO(0xAE, 0x00) to this system query.
          KVM_GET_API_VERSION = 0xAE00
          device = "/dev/kvm"
          uid = os.geteuid()
          stage = "runner-identity"
          try:
              caps = {}
              cap_fields = {"CapPrm", "CapEff", "CapAmb"}
              for line in Path("/proc/self/status").read_text(encoding="ascii").splitlines():
                  name, _, value = line.partition(":")
                  if name in cap_fields:
                      if name in caps:
                          fail(stage, "duplicate-capability-field")
                      caps[name] = int(value, 16)
              if uid == 0 or os.getuid() != uid or caps.keys() != cap_fields or any(caps.values()):
                  fail(stage, "expected-non-root-with-no-permitted-effective-or-ambient-caps")
              print(f"stage={stage} status=pass uid={uid}", flush=True)

              stage = "device-inspect"
              node = os.lstat(device)
              if not stat.S_ISCHR(node.st_mode):
                  fail(stage, "expected-character-device")
              number = f"{os.major(node.st_rdev)}:{os.minor(node.st_rdev)}"
              kernel_number = Path("/sys/class/misc/kvm/dev").read_text(encoding="ascii").strip()
              if number != kernel_number:
                  fail(stage, "device-number-does-not-match-the-kernel-kvm-registration")
              print(f"stage={stage} status=pass device={number} mode={stat.S_IMODE(node.st_mode):04o}", flush=True)

              stage = "device-open"
              fd = os.open(device, os.O_RDWR | os.O_CLOEXEC | os.O_NOFOLLOW)
              try:
                  stage = "device-identity"
                  opened = os.fstat(fd)
                  if (
                      not stat.S_ISCHR(opened.st_mode)
                      or (opened.st_dev, opened.st_ino, opened.st_rdev) != (node.st_dev, node.st_ino, node.st_rdev)
                  ):
                      fail(stage, "opened-device-differs-from-inspected-device")
                  stage = "kvm-api"
                  version = fcntl.ioctl(fd, KVM_GET_API_VERSION)
              finally:
                  os.close(fd)
          except OSError as error:
              fail(stage, f"errno={error.errno}")
          except ValueError:
              fail(stage, "unreadable-capability-or-device-metadata")

          if version != 12:
              fail("kvm-api", f"version={version} expected=12")
          print("stage=kvm-api status=pass version=12", flush=True)
          PY
