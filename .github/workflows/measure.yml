# The network-change monitor's measurements on the hosted Ubuntu runners
# (docs/specs/network-generation.md, section 13, Q5, Q7, Q8 and Q9).
# Each measurement is an ignored test of ironafs-os, run as root in a
# network namespace of its own. The jobs check that the evidence was emitted.

name: Measure

on:
  push:
    branches: [m2a-97-netgen]
  workflow_dispatch:
    inputs:
      rounds:
        description: Q7 and Q9 rounds per mode (1-1000)
        default: "1000"
        required: true
      seconds:
        description: Q8 soak in seconds (1-4800)
        default: "3600"
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: measure ${{ matrix.measurement.name }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
        measurement:
          # Each barrier allows a 100 ms drain, 10 s of refill, and up to
          # 11 s for an ACK. At 1,000 rounds that is about 352 minutes per
          # mode, before dumps and setup. The no-churn job also runs Q5.
          - { name: none, timeout: 360 }
          - { name: routes, timeout: 360 }
          - { name: soak, timeout: 90 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.measurement.timeout }}
    permissions:
      contents: read
    env:
      MEASUREMENT: ${{ matrix.measurement.name }}
      IRONAFS_MEASURE_ROUNDS: ${{ github.event_name == 'push' && '1000' || inputs.rounds }}
      IRONAFS_MEASURE_SECONDS: ${{ github.event_name == 'push' && '3600' || inputs.seconds }}
    steps:
      - name: Validate measurement inputs
        run: |
          if [[ ! "$IRONAFS_MEASURE_ROUNDS" =~ ^([1-9][0-9]{0,2}|1000)$ ]]; then
            echo "rounds must be a decimal integer from 1 through 1000" >&2
            exit 1
          fi
          if [[ ! "$IRONAFS_MEASURE_SECONDS" =~ ^([1-9][0-9]{0,2}|[1-3][0-9]{3}|4[0-7][0-9]{2}|4800)$ ]]; then
            echo "seconds must be a decimal integer from 1 through 4800" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustc --version
      - name: Build the measurements
        run: cargo test -p ironafs-os --lib --locked --no-run
      - name: Run each measurement, as root in a network namespace of its own
        run: |
          uname -r
          output=$(mktemp)
          trap 'rm -f "$output"' EXIT

          require_count() {
            local count
            count=$(grep -Ec "$1" "$output" || [[ $? == 1 ]])
            if [[ "$count" != "$2" ]]; then
              echo "expected $2 lines matching $1, found $count" >&2
              return 1
            fi
          }

          require_line() {
            require_count "$1" 1
          }

          run_measurement() {
            local test="linux_rtnetlink::tests::kernel::measure::$1"
            sudo env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
              "IRONAFS_MEASURE_CHURN=$MEASUREMENT" \
              "IRONAFS_MEASURE_ROUNDS=$IRONAFS_MEASURE_ROUNDS" "IRONAFS_MEASURE_SECONDS=$IRONAFS_MEASURE_SECONDS" \
              unshare --net -- cargo test -p ironafs-os --lib --locked -- --ignored --exact --nocapture --test-threads=2 \
              "$test" 2>&1 | tee "$output"
            require_line '^running 1 test$'
            require_line '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;'
          }

          case "$MEASUREMENT" in
            none|routes)
              if [[ "$MEASUREMENT" == none ]]; then
                run_measurement q5_the_notify_socket_binds_with_the_nexthop_bit_and_receives_each_kind
                require_line '^measure q5 kernel=[^ ]+ bind='
              fi

              run_measurement q7_and_q9_each_round_trip_and_send_at_the_caps_worst_case
              require_line '^measure q7 kernel=[^ ]+ backlog_target_bytes=[1-9][0-9]* receive_buffer=[1-9][0-9]*$'
              for dump in links addresses; do
                require_line "^measure q7 kernel=[^ ]+ churn=$MEASUREMENT dump=$dump objects="
                require_line "^measure q9 kernel=[^ ]+ churn=$MEASUREMENT send=dump-$dump n="
              done
              require_line "^measure q7 kernel=[^ ]+ churn=$MEASUREMENT barrier failed=[0-9]+ overflowed=[0-9]+ failed_with_observed_overflow=[0-9]+ failed_without_observed_overflow=[0-9]+ "
              require_line "^measure q9 kernel=[^ ]+ churn=$MEASUREMENT send=barrier n="
              require_count '^measure q7-round ' "$IRONAFS_MEASURE_ROUNDS"
              require_count "^measure q7-round kernel=[^ ]+ churn=$MEASUREMENT sequence=[0-9]+ outcome=(acknowledged|timed_out|send_failed) pre_send_overflows=[0-9]+ overflow_observed=(true|false) fill_bytes=[0-9]+ send_ns=[0-9]+$" "$IRONAFS_MEASURE_ROUNDS"
              ;;
            soak)
              run_measurement q8_every_report_is_explained_by_its_receive_over_overflows_and_churn
              require_line '^measure q8 kernel=[^ ]+ seconds=[0-9]+ bursts='
              ;;
            *)
              echo "unknown measurement group: $MEASUREMENT" >&2
              exit 1
              ;;
          esac
