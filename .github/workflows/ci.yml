name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check REUSE headers
        run: docker run --rm --volume "$PWD:/data" fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e lint
      - name: Install cargo-deny
        run: |
          download_dir=$(mktemp -d)
          cd "$download_dir" || exit
          archive=cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$archive"
          printf '%s  %s\n' 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f "$archive" | sha256sum -c -
          tar -xzf "$archive"
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          install -d "$cargo_bin"
          install -m 0755 "${archive%.tar.gz}/cargo-deny" "$cargo_bin/cargo-deny"
      - name: Check dependencies
        run: cargo deny --locked check
      - name: Check the clock and randomness bans fire
        run: cargo --locked xtask check-bans
      - name: Prove a removed or misspelt ban is caught
        run: cargo --locked xtask check-bans --self-test
      - name: Check the architecture's dependency rules
        run: cargo --locked xtask check-deps
      - name: Prove the dependency rules catch planted violations
        run: cargo --locked xtask check-deps --self-test
      - name: Check the rights evaluator's confinement
        run: cargo --locked xtask check-grants
      - name: Prove the confinement catches planted violations
        run: cargo --locked xtask check-grants --self-test
      - name: Build the pure crates against core and alloc alone
        run: cargo --locked xtask check-pure
      - name: Prove the pure-crate build catches planted violations
        run: cargo --locked xtask check-pure --self-test
      - name: Check unsafe stays in ironafs-os and matches ADR 0005's table
        run: cargo --locked xtask check-os
      - name: Prove the site inventory catches planted changes
        run: cargo --locked xtask check-os --self-test

  test:
    name: test
    # Linux only until OS-specific code exists; the Windows and macOS targets
    # are linted from Linux (coding standards rule 15 adds their runners).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustc --version
          cargo --version
      - name: Run Clippy
        env:
          CARGO_BUILD_WARNINGS: deny
        run: |
          cargo clippy --all-targets --workspace --locked
          cargo clippy --all-targets --workspace --locked --target aarch64-unknown-linux-gnu
          cargo clippy --all-targets --workspace --locked --target x86_64-pc-windows-msvc
          cargo clippy --all-targets --workspace --locked --target aarch64-apple-darwin
      - name: Install cargo-nextest
        run: |
          download_dir=$(mktemp -d)
          cd "$download_dir" || exit
          archive=cargo-nextest-0.9.151-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.151/$archive"
          printf '%s  %s\n' 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4 "$archive" | sha256sum -c -
          tar -xzf "$archive"
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          install -d "$cargo_bin"
          install -m 0755 cargo-nextest "$cargo_bin/cargo-nextest"
      - name: Prove mem-wipe's stores survive the release profile, x86_64 and aarch64 Linux
        run: cargo --locked xtask check-wipe
      - name: Run tests
        run: cargo nextest run --workspace --profile ci --retries 0 --no-tests fail --locked
      - name: Run doc-tests
        timeout-minutes: 5
        run: cargo test --doc --workspace --locked
      - name: Run the dump marker tests, with core files and with a piped collector
        # ADR 0004, O26, point 5, and ADR 0005, sheets 11 and 12: each image
        # goes to <dir>/core.<pid> in a directory only the runner's user can
        # enter, first written by the kernel, then piped to a collector that
        # copies its standard input to that one file (with core_pipe_limit
        # above zero, so the kernel waits for it). The marker tests run as
        # the runner's user, whose shell raised the core-file limit: sudo
        # would set it back to 0 (sudoers(5): "the core dump file size ...
        # is set by sudoers to 0 by default"). Each named case must pass in
        # each mode.
        timeout-minutes: 10
        run: |
          dir="$RUNNER_TEMP/ironafs-cores"
          mkdir -m 0700 "$dir"
          collector="$RUNNER_TEMP/ironafs-core-collector"
          printf '#!/bin/sh\nexec /usr/bin/cat > "$1"\n' > "$collector"
          chmod 0755 "$collector"
          ulimit -c unlimited
          export IRONAFS_CORE_DIR="$dir"
          markers="unix_nodump::tests::kernel::disable_dumps_leaves_no_image_where_an_unprotected_child_leaves_its_marker
          linux_dontdump::tests::kernel::dump_of_an_unprotected_child_holds_its_control_marker_and_not_its_secret_buffer"
          filter=$(printf 'test(=%s) | ' $markers)
          for pattern in "$dir/core.%p" "|$collector $dir/core.%p"; do
            sudo sysctl -w kernel.core_pipe_limit=16 "kernel.core_pattern=$pattern"
            status=0
            cargo nextest run -p ironafs-os --profile ci --retries 0 --no-tests fail --locked --run-ignored only -E "${filter% | }" > markers.log 2>&1 || status=$?
            cat markers.log
            test "$status" -eq 0
            for test in $markers; do
              grep -Eq "^ +PASS .* ironafs-os $test\$" markers.log
            done
          done
      - name: Run the tests that need root, each named
        # The dumpable attribute after an exec under another uid and after
        # a set-id exec (the direct id-change reset is not observed: no
        # site changes an id), and a peer under another uid, through
        # nextest's target runner.
        timeout-minutes: 10
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: |
          privileged="unix_nodump::tests::kernel::an_exec_as_another_user_resets_the_attribute_and_disable_dumps_restores_it
          unix_nodump::tests::kernel::a_set_id_exec_resets_the_attribute_to_suid_dumpable_and_disable_dumps_restores_it
          linux_peercred::tests::kernel::peer_credentials_name_a_peer_under_another_uid"
          filter=$(printf 'test(=%s) | ' $privileged)
          status=0
          cargo nextest run -p ironafs-os --profile ci --retries 0 --no-tests fail --locked --run-ignored only -E "${filter% | }" > privileged.log 2>&1 || status=$?
          cat privileged.log
          test "$status" -eq 0
          for test in $privileged; do
            grep -Eq "^ +PASS .* ironafs-os $test\$" privileged.log
          done

  os-linux:
    name: os-linux (${{ matrix.runner }}, ${{ matrix.target }})
    # The real-call tests and the ABI check of ironafs-os on each Linux
    # target ADR 0005 allows, each on its own architecture with its own C
    # library's headers (point 5.6; sheet tests, point 6.4), on Ubuntu
    # 24.04 and 26.04. Each lane names the target it proves, the sites
    # check-abi must have proved, and the native tests that must have run;
    # check-abi also checks that $CC is that target's compiler (its
    # architecture and C library).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            nextest: cargo-nextest-0.9.151-x86_64-unknown-linux-gnu.tar.gz
            nextest_sha256: 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            nextest: cargo-nextest-0.9.151-x86_64-unknown-linux-gnu.tar.gz
            nextest_sha256: 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4
            cc: musl-gcc
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            nextest: cargo-nextest-0.9.151-aarch64-unknown-linux-gnu.tar.gz
            nextest_sha256: 3e35e8f6913af92558ba09d7155f74e35dd1f0024ef3cd891637433ae4eacbdd
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            nextest: cargo-nextest-0.9.151-aarch64-unknown-linux-gnu.tar.gz
            nextest_sha256: 3e35e8f6913af92558ba09d7155f74e35dd1f0024ef3cd891637433ae4eacbdd
            cc: musl-gcc
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            nextest: cargo-nextest-0.9.151-x86_64-unknown-linux-gnu.tar.gz
            nextest_sha256: 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
            nextest: cargo-nextest-0.9.151-x86_64-unknown-linux-gnu.tar.gz
            nextest_sha256: 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4
            cc: musl-gcc
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            nextest: cargo-nextest-0.9.151-aarch64-unknown-linux-gnu.tar.gz
            nextest_sha256: 3e35e8f6913af92558ba09d7155f74e35dd1f0024ef3cd891637433ae4eacbdd
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
            nextest: cargo-nextest-0.9.151-aarch64-unknown-linux-gnu.tar.gz
            nextest_sha256: 3e35e8f6913af92558ba09d7155f74e35dd1f0024ef3cd891637433ae4eacbdd
            cc: musl-gcc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      SITES: linux-clock linux-random unix-nodump linux-dontdump linux-peercred linux-fdpass linux-udp6 linux-statvfs linux-rtnetlink
      NATIVE_TESTS: >-
        linux_clock::tests::read_clock_boot_advances_and_never_goes_back
        linux_clock::tests::read_clock_awake_advances_and_never_goes_back
        linux_random::tests::fill_random_fills_buffers_of_each_size_the_sheet_names
        linux_random::tests::getrandom_reports_a_full_piece_of_at_most_256_bytes
        mem_wipe::tests::wipe_zeroes_every_byte_of_every_length_from_0_to_257
        unix_nodump::tests::disable_dumps_in_this_process_reads_back_not_dumpable
        linux_dontdump::tests::secret_buffer_new_advises_its_whole_block_through_the_call
        linux_peercred::tests::kernel::peer_credentials_of_a_socket_pair_name_this_process_s_effective_ids
        linux_peercred::tests::kernel::peer_credentials_refuse_a_listener_wrapped_as_a_stream
        linux_fdpass::tests::kernel::one_descriptor_arrives_close_on_exec_and_nothing_else_stays_open
        linux_fdpass::tests::kernel::three_descriptors_are_truncated_and_what_was_delivered_is_closed
        linux_udp6::tests::kernel::an_ipv4_socket_bound_first_shares_its_port_with_this_one
        linux_udp6::tests::kernel::a_port_held_by_another_ipv6_socket_is_in_use_and_nothing_stays_open
        linux_statvfs::tests::kernel::the_answer_for_proc_is_what_stat_says
        linux_statvfs::tests::kernel::the_answer_for_the_root_and_temporary_directories_is_what_stat_says
        linux_rtnetlink::tests::kernel::a_dump_is_answered_on_the_request_socket_ending_in_done
        linux_rtnetlink::tests::kernel::a_dump_datagram_larger_than_the_buffer_is_truncated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and the target
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustup target add "$TARGET"
          rustc --version
      - name: Install musl's C compiler wrapper and headers
        if: matrix.cc == 'musl-gcc'
        # musl-gcc searches musl's headers only; linux-rtnetlink's
        # declarations are the kernel's own (<linux/netlink.h>), which no C
        # library declares, so the kernel's headers (linux, asm,
        # asm-generic), and nothing of glibc's, join its search path.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools linux-libc-dev
          musl-gcc --version
          headers="$RUNNER_TEMP/kernel-headers"
          mkdir -p "$headers"
          ln -s /usr/include/linux /usr/include/asm-generic "$headers/"
          ln -s "/usr/include/$(uname -m)-linux-gnu/asm" "$headers/asm"
          echo "C_INCLUDE_PATH=$headers" >> "$GITHUB_ENV"
      - name: Install cargo-nextest
        env:
          ARCHIVE: ${{ matrix.nextest }}
          ARCHIVE_SHA256: ${{ matrix.nextest_sha256 }}
        run: |
          download_dir=$(mktemp -d)
          cd "$download_dir" || exit
          curl --fail --silent --show-error --location --output "$ARCHIVE" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.151/$ARCHIVE"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE"
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          install -d "$cargo_bin"
          install -m 0755 cargo-nextest "$cargo_bin/cargo-nextest"
      - name: Run ironafs-os's tests on the target, real system calls included
        run: |
          cargo nextest run -p ironafs-os --target "$TARGET" --profile ci --retries 0 --no-tests fail --locked > nextest.log 2>&1
          cat nextest.log
          for test in $NATIVE_TESTS; do
            grep -Eq "PASS .* ironafs-os $test\$" nextest.log
          done
      - name: Lint ironafs-os for the target, its C library's declarations included
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy -p ironafs-os --all-targets --target "$TARGET" --locked
      - name: Prove the target's foreign declarations against its C headers
        env:
          CC: ${{ matrix.cc || 'cc' }}
        run: |
          cargo --locked xtask check-abi --target "$TARGET" > check-abi.log
          cat check-abi.log
          grep -q "^check-abi: $TARGET: " check-abi.log
          for site in $SITES; do
            grep -q "$site (" check-abi.log
          done
      - name: Prove the declaration check catches planted mismatches
        env:
          CC: ${{ matrix.cc || 'cc' }}
        run: cargo --locked xtask check-abi --self-test
      - name: Run linux-udp6's sandbox test under a filter that denies AF_INET6
        # systemd's RestrictAddressFamilies answers a denied family's
        # socket() with EAFNOSUPPORT (systemd.exec(5)), as the daemon's own
        # unit would; the test binary runs as this user under it.
        run: |
          binary=$(cargo test -p ironafs-os --lib --target "$TARGET" --locked --no-run --message-format json \
            | python3 -c 'import json, sys
          for line in sys.stdin:
              item = json.loads(line)
              if item.get("reason") == "compiler-artifact" and item.get("executable") and item.get("profile", {}).get("test"):
                  print(item["executable"])')
          test -x "$binary"
          sudo systemd-run --quiet --wait --pipe --collect -p User="$(id -un)" -p RestrictAddressFamilies='~AF_INET6' \
            "$binary" --ignored --exact linux_udp6::tests::kernel::a_sandbox_that_denies_the_family_is_unsupported \
            > sandbox.log 2>&1 || { cat sandbox.log; exit 1; }
          cat sandbox.log
          grep -q '^test result: ok\. 1 passed;' sandbox.log
      - name: Run the filesystem tests of linux-statvfs on filesystems made for them
        # A tmpfs of one mebibyte, and an ext4 that reserves 5% for its
        # superuser (so a query of the wrong field is caught).
        run: |
          sudo mkdir -p /mnt/ironafs-tmpfs /mnt/ironafs-reserved
          sudo mount -t tmpfs -o size=1m,mode=1777 tmpfs /mnt/ironafs-tmpfs
          truncate -s 64M "$RUNNER_TEMP/reserved.img"
          mkfs.ext4 -q -m 5 "$RUNNER_TEMP/reserved.img"
          sudo mount -o loop "$RUNNER_TEMP/reserved.img" /mnt/ironafs-reserved
          sudo chmod 1777 /mnt/ironafs-reserved
          IRONAFS_OS_TEST_TMPFS=/mnt/ironafs-tmpfs IRONAFS_OS_TEST_RESERVED=/mnt/ironafs-reserved \
            cargo nextest run -p ironafs-os --target "$TARGET" --profile ci --retries 0 --no-tests fail --locked \
            --run-ignored only -E 'test(/^linux_statvfs::/)' > statvfs.log 2>&1 || { cat statvfs.log; exit 1; }
          cat statvfs.log
          grep -q ' 2 passed' statvfs.log
      - name: Run linux-udp6's kernel tests at bindv6only 0 and at 1, each in a network namespace of its own
        # The value is set in the namespace and checked from inside the test
        # run (an ignored test), so the port-sharing cases are known to have
        # run at 0, where only IPV6_V6ONLY lets them pass.
        run: |
          for value in 0 1; do
            sudo env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
              "TARGET=$TARGET" "IRONAFS_OS_TEST_BINDV6ONLY=$value" unshare --net -- sh -c '
                sysctl -q -w net.ipv6.bindv6only="$IRONAFS_OS_TEST_BINDV6ONLY" && ip link set lo up &&
                cargo nextest run -p ironafs-os --target "$TARGET" --profile ci --retries 0 --no-tests fail \
                  --locked --run-ignored all -E "test(/^linux_udp6::tests::kernel::/) - test(/sandbox/)"' \
              > "udp6-$value.log" 2>&1 || { cat "udp6-$value.log"; exit 1; }
            cat "udp6-$value.log"
            grep -q ' 7 passed' "udp6-$value.log"
          done
      - name: Run the network-namespace tests of linux-rtnetlink, as root in a namespace of their own
        # Last, since it builds as root. One test at a time: they share the
        # namespace, and one's burst or forged datagram reaches the others.
        run: |
          sudo env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            unshare --net -- cargo nextest run -p ironafs-os --target "$TARGET" --profile ci --retries 0 \
            --no-tests fail --locked --run-ignored only --test-threads 1 -E 'test(/^linux_rtnetlink::/)' \
            > netns.log 2>&1 || { cat netns.log; exit 1; }
          cat netns.log
          grep -q ' 3 passed' netns.log

  os-linux-glibc-2-28:
    name: os-linux (glibc 2.28, aarch64)
    # The oldest glibc of the build goal (ADR 0004, L42, point 3; ADR 0005,
    # point 5.5): ironafs-os built and its tests run on AlmaLinux 8. The
    # conditional glibc 2.17 artefact is qualified separately, before it is
    # offered.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: docker.io/library/almalinux:8@sha256:34a85f19e05e28243249d45dd3842621741a43b110865ca80575c9b4e083cc29
    env:
      SITES: linux-clock linux-random unix-nodump linux-dontdump linux-peercred linux-fdpass linux-udp6 linux-statvfs linux-rtnetlink
      NATIVE_TESTS: >-
        linux_clock::tests::read_clock_boot_advances_and_never_goes_back
        linux_random::tests::fill_random_fills_buffers_of_each_size_the_sheet_names
        mem_wipe::tests::wipe_zeroes_every_byte_of_every_length_from_0_to_257
        unix_nodump::tests::disable_dumps_in_this_process_reads_back_not_dumpable
        linux_dontdump::tests::secret_buffer_new_advises_its_whole_block_through_the_call
        linux_peercred::tests::kernel::peer_credentials_of_a_socket_pair_name_this_process_s_effective_ids
        linux_fdpass::tests::kernel::one_descriptor_arrives_close_on_exec_and_nothing_else_stays_open
        linux_udp6::tests::kernel::an_ipv4_socket_bound_first_shares_its_port_with_this_one
        linux_udp6::tests::kernel::a_port_held_by_another_ipv6_socket_is_in_use_and_nothing_stays_open
        linux_statvfs::tests::kernel::the_answer_for_proc_is_what_stat_says
        linux_statvfs::tests::kernel::a_descriptor_that_is_not_a_directory_s_is_refused_and_nothing_stays_open
        linux_rtnetlink::tests::kernel::a_dump_is_answered_on_the_request_socket_ending_in_done
        linux_rtnetlink::tests::kernel::a_dump_datagram_larger_than_the_buffer_is_truncated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install a C toolchain and Rust
        run: |
          dnf --assumeyes install gcc glibc-headers kernel-headers
          ldd --version | head -n 1 | grep -q ' 2\.28$'
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs > rustup-init.sh
          sh rustup-init.sh -y --default-toolchain none --profile minimal
          "$HOME/.cargo/bin/rustup" toolchain install --profile minimal --no-self-update --no-update
      - name: Run ironafs-os's unit tests on glibc 2.28
        # The unit tests alone (the doctests run in the next step), one at
        # a time, since some count this process's open descriptors. The
        # ignored tests are exactly those the source marks, and the named
        # native tests of every site passed.
        run: |
          "$HOME/.cargo/bin/cargo" test -p ironafs-os --lib --locked -- --test-threads 1 > test.log 2>&1 || { cat test.log; exit 1; }
          cat test.log
          marked=$(grep -rE '^\s*#\[ignore' crates/ironafs-os/src | wc -l)
          grep -Eq "^test result: ok\. [1-9][0-9]* passed; 0 failed; $marked ignored;" test.log
          for test in $NATIVE_TESTS; do
            grep -q "^test $test \.\.\. ok\$" test.log
          done
      - name: Run ironafs-os's doctests on glibc 2.28
        run: |
          "$HOME/.cargo/bin/cargo" test -p ironafs-os --doc --locked > doc.log 2>&1 || { cat doc.log; exit 1; }
          cat doc.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' doc.log
      - name: Prove the declarations against glibc 2.28's headers
        run: |
          "$HOME/.cargo/bin/cargo" --locked xtask check-abi > check-abi.log
          cat check-abi.log
          grep -q '^check-abi: aarch64-unknown-linux-gnu: ' check-abi.log
          for site in $SITES; do
            grep -q "$site (" check-abi.log
          done

  miri:
    name: miri
    # The Miri job of coding standards rule 5, with the first crate that
    # holds unsafe (ADR 0005, point 6.5): each foreign call is replaced by
    # its in-crate stand-in, so the wrappers' own pointers and checks run
    # under Miri, and mem-wipe's own block.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly with Miri
        run: |
          rustup toolchain install nightly-2026-11-01 --profile minimal --component miri,rust-src --no-self-update
          cargo +nightly-2026-11-01 miri --version
      - name: Run ironafs-os under Miri, host and aarch64 Linux
        # A run that ran nothing, or ignored a test, proves nothing: each
        # must report every test passed and none ignored, and the named
        # wrapper and wipe tests must be among them. Tests that need the
        # kernel itself (child processes, /proc) are not built under Miri.
        # The random site passes its buffer's exposed address, as the C call
        # needs, so Miri runs with permissive provenance, which only silences its warning about
        # that integer-to-pointer cast (the cast is the design, not a bug).
        env:
          MIRIFLAGS: -Zmiri-permissive-provenance
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            cargo +nightly-2026-11-01 miri test --locked -p ironafs-os --lib --target "$target" > "miri-$target.log" 2>&1
            cat "miri-$target.log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "miri-$target.log"
            for test in \
              linux_clock::tests::read_clock_boot_advances_and_never_goes_back \
              linux_random::tests::fill_random_fills_buffers_of_each_size_the_sheet_names \
              linux_random::tests::arguments_pass_the_buffer_address_and_length_and_zeros_each_as_a_long \
              unix_nodump::tests::disable_dumps_in_this_process_reads_back_not_dumpable \
              linux_dontdump::tests::secret_buffer_new_advises_its_whole_block_through_the_call \
              linux_peercred::tests::peer_credentials_of_a_socket_pair_name_this_process \
              linux_fdpass::tests::a_sent_descriptor_arrives_as_a_new_descriptor_for_the_same_socket \
              fdpass::tests::accept_hands_out_only_the_valid_case_and_never_leaks_across_the_sweep \
              linux_udp6::tests::stand_in::the_calls_are_socket_then_ipv6_only_set_to_one_then_bind \
              linux_udp6::tests::stand_in::a_failed_option_leaves_the_socket_unbound \
              linux_statvfs::tests::measure_queries_the_descriptor_s_filesystem_through_the_call \
              linux_rtnetlink::tests::stand_in::a_short_sender_address_and_a_wrong_family_are_no_sender \
              linux_rtnetlink::tests::stand_in::a_reply_from_another_port_is_refused \
              linux_rtnetlink::tests::stand_in::a_reply_longer_than_the_buffer_is_truncated \
              route::tests::the_sweep_of_every_field_returns_only_the_kernel_s_whole_datagram \
              linux_udp6::tests::stand_in::a_missing_family_and_an_address_in_use_are_told_apart_through_the_calls \
              linux_statvfs::tests::stand_in::an_interrupted_query_is_made_again \
              linux_rtnetlink::tests::stand_in::an_interrupted_send_and_receive_are_each_made_again \
              linux_rtnetlink::tests::stand_in::an_overflow_and_another_failure_are_told_apart_through_the_receive \
              linux_peercred::tests::stand_in::a_short_and_an_over_long_length_from_the_call_are_refused \
              linux_dontdump::tests::stand_in::a_failed_exclusion_hands_out_no_buffer \
              linux_dontdump::tests::stand_in::a_dropped_buffer_is_all_zero_when_its_memory_is_released \
              linux_fdpass::tests::stand_in::an_interrupted_send_and_receive_are_each_made_again \
              mem_wipe::tests::wipe_zeroes_every_byte_of_every_length_from_0_to_257; do
              grep -q "^test $test \.\.\. ok$" "miri-$target.log"
            done
          done

  trailers:
    name: trailers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustc --version
          cargo --version
      - name: Check pull request trailers
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: cargo --locked xtask trailers pr
      - name: Check landed commit trailers
        if: github.event_name == 'push'
        run: cargo --locked xtask trailers main

  ci-ok:
    name: ci-ok
    needs: [lint, test, os-linux, os-linux-glibc-2-28, miri, trailers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require lint, test, os-linux, glibc 2.28, Miri and trailer check success
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          OS_LINUX_RESULT: ${{ needs.os-linux.result }}
          OLD_GLIBC_RESULT: ${{ needs.os-linux-glibc-2-28.result }}
          MIRI_RESULT: ${{ needs.miri.result }}
          TRAILERS_RESULT: ${{ needs.trailers.result }}
        run: |
          printf 'lint: %s\ntest: %s\nos-linux: %s\nglibc 2.28: %s\nmiri: %s\ntrailers: %s\n' "$LINT_RESULT" "$TEST_RESULT" "$OS_LINUX_RESULT" "$OLD_GLIBC_RESULT" "$MIRI_RESULT" "$TRAILERS_RESULT"
          [[ "$LINT_RESULT" == success && "$TEST_RESULT" == success && "$OS_LINUX_RESULT" == success && "$OLD_GLIBC_RESULT" == success && "$MIRI_RESULT" == success && "$TRAILERS_RESULT" == success ]]
