name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check REUSE headers
        run: docker run --rm --volume "$PWD:/data" fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e lint
      - name: Install cargo-deny
        run: |
          download_dir=$(mktemp -d)
          cd "$download_dir" || exit
          archive=cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$archive"
          printf '%s  %s\n' 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f "$archive" | sha256sum -c -
          tar -xzf "$archive"
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          install -d "$cargo_bin"
          install -m 0755 "${archive%.tar.gz}/cargo-deny" "$cargo_bin/cargo-deny"
      - name: Check dependencies
        run: cargo deny --locked check
      - name: Check the clock and randomness bans fire
        run: cargo --locked xtask check-bans
      - name: Prove a removed or misspelt ban is caught
        run: cargo --locked xtask check-bans --self-test
      - name: Check the architecture's dependency rules
        run: cargo --locked xtask check-deps
      - name: Prove the dependency rules catch planted violations
        run: cargo --locked xtask check-deps --self-test
      - name: Check the rights evaluator's confinement
        run: cargo --locked xtask check-grants
      - name: Prove the confinement catches planted violations
        run: cargo --locked xtask check-grants --self-test
      - name: Check the fuzz crate's dependency policy against the root's
        run: cargo --locked xtask check-fuzz-deny
      - name: Prove a drifted fuzz dependency policy is caught
        run: cargo --locked xtask check-fuzz-deny --self-test
      - name: Prove the fuzz step fails when nothing ran and prints no reproducer
        run: cargo --locked xtask fuzz --self-test
      - name: Install the fuzz crate's pinned nightly
        working-directory: fuzz
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustc --version
          cargo --version
      - name: Check the fuzz crate's dependencies
        working-directory: fuzz
        run: cargo deny --locked check
      - name: Build the pure crates against core and alloc alone
        run: cargo --locked xtask check-pure
      - name: Prove the pure-crate build catches planted violations
        run: cargo --locked xtask check-pure --self-test
      - name: Check the seams' source rules
        run: cargo --locked xtask check-seams
      - name: Prove the seam rules catch planted violations
        run: cargo --locked xtask check-seams --self-test
      - name: Check unsafe stays in ironafs-os and matches ADR 0005's table
        run: cargo --locked xtask check-os
      - name: Prove the site inventory catches planted changes
        run: cargo --locked xtask check-os --self-test

  test:
    name: test
    # Linux only until OS-specific code exists; the Windows and macOS targets
    # are linted from Linux (coding standards rule 15 adds their runners).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustc --version
          cargo --version
      - name: Run Clippy
        env:
          CARGO_BUILD_WARNINGS: deny
        run: |
          cargo clippy --all-targets --workspace --locked
          cargo clippy --all-targets --workspace --locked --target aarch64-unknown-linux-gnu
          cargo clippy --all-targets --workspace --locked --target x86_64-pc-windows-msvc
          cargo clippy --all-targets --workspace --locked --target aarch64-apple-darwin
      - name: Install cargo-nextest
        run: |
          download_dir=$(mktemp -d)
          cd "$download_dir" || exit
          archive=cargo-nextest-0.9.151-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.151/$archive"
          printf '%s  %s\n' 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4 "$archive" | sha256sum -c -
          tar -xzf "$archive"
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          install -d "$cargo_bin"
          install -m 0755 cargo-nextest "$cargo_bin/cargo-nextest"
      - name: Run tests
        run: cargo nextest run --workspace --profile ci --retries 0 --no-tests fail --locked
      - name: Run doc-tests
        timeout-minutes: 5
        run: cargo test --doc --workspace --locked

  os-linux:
    name: os-linux (${{ matrix.runner }}, ${{ matrix.target }})
    # The real-call tests and the ABI check of ironafs-os on each Linux
    # target ADR 0005 allows, each on its own architecture with its own C
    # library's headers (point 5.6; sheet tests, point 6.4), on Ubuntu
    # 24.04 and 26.04. Each lane names the target it proves, the sites
    # check-abi must have proved, and the native tests that must have run;
    # check-abi also checks that $CC is that target's compiler (its
    # architecture and C library).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            nextest: cargo-nextest-0.9.151-x86_64-unknown-linux-gnu.tar.gz
            nextest_sha256: 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            nextest: cargo-nextest-0.9.151-x86_64-unknown-linux-gnu.tar.gz
            nextest_sha256: 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4
            cc: musl-gcc
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            nextest: cargo-nextest-0.9.151-aarch64-unknown-linux-gnu.tar.gz
            nextest_sha256: 3e35e8f6913af92558ba09d7155f74e35dd1f0024ef3cd891637433ae4eacbdd
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            nextest: cargo-nextest-0.9.151-aarch64-unknown-linux-gnu.tar.gz
            nextest_sha256: 3e35e8f6913af92558ba09d7155f74e35dd1f0024ef3cd891637433ae4eacbdd
            cc: musl-gcc
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            nextest: cargo-nextest-0.9.151-x86_64-unknown-linux-gnu.tar.gz
            nextest_sha256: 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
            nextest: cargo-nextest-0.9.151-x86_64-unknown-linux-gnu.tar.gz
            nextest_sha256: 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4
            cc: musl-gcc
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            nextest: cargo-nextest-0.9.151-aarch64-unknown-linux-gnu.tar.gz
            nextest_sha256: 3e35e8f6913af92558ba09d7155f74e35dd1f0024ef3cd891637433ae4eacbdd
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
            nextest: cargo-nextest-0.9.151-aarch64-unknown-linux-gnu.tar.gz
            nextest_sha256: 3e35e8f6913af92558ba09d7155f74e35dd1f0024ef3cd891637433ae4eacbdd
            cc: musl-gcc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      SITES: linux-clock linux-random
      NATIVE_TESTS: >-
        linux_clock::tests::read_clock_boot_advances_and_never_goes_back
        linux_clock::tests::read_clock_awake_advances_and_never_goes_back
        linux_random::tests::fill_random_fills_buffers_of_each_size_the_sheet_names
        linux_random::tests::getrandom_reports_a_full_piece_of_at_most_256_bytes
        mem_wipe::tests::wipe_zeroes_every_byte_of_every_length_from_0_to_257
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and the target
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustup target add "$TARGET"
          rustc --version
      - name: Install musl's C compiler wrapper and headers
        if: matrix.cc == 'musl-gcc'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          musl-gcc --version
      - name: Install cargo-nextest
        env:
          ARCHIVE: ${{ matrix.nextest }}
          ARCHIVE_SHA256: ${{ matrix.nextest_sha256 }}
        run: |
          download_dir=$(mktemp -d)
          cd "$download_dir" || exit
          curl --fail --silent --show-error --location --output "$ARCHIVE" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.151/$ARCHIVE"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE"
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          install -d "$cargo_bin"
          install -m 0755 cargo-nextest "$cargo_bin/cargo-nextest"
      - name: Run ironafs-os's tests on the target, real system calls included
        run: |
          cargo nextest run -p ironafs-os --target "$TARGET" --profile ci --retries 0 --no-tests fail --locked > nextest.log 2>&1
          cat nextest.log
          for test in $NATIVE_TESTS; do
            grep -Eq "PASS .* ironafs-os $test\$" nextest.log
          done
      - name: Prove the target's foreign declarations against its C headers
        env:
          CC: ${{ matrix.cc || 'cc' }}
        run: |
          cargo --locked xtask check-abi --target "$TARGET" > check-abi.log
          cat check-abi.log
          grep -q "^check-abi: $TARGET: " check-abi.log
          for site in $SITES; do
            grep -q "$site (" check-abi.log
          done
      - name: Prove the declaration check catches planted mismatches
        env:
          CC: ${{ matrix.cc || 'cc' }}
        run: cargo --locked xtask check-abi --self-test

  os-linux-glibc-2-28:
    name: os-linux (glibc 2.28, ${{ matrix.target }})
    # The oldest glibc of the build goal (ADR 0004, L42, point 3; ADR 0005,
    # point 5.5): ironafs-os built and its tests run on AlmaLinux 8, on
    # each Linux architecture. Each lane proves the target it built and
    # the runtime it ran on, and requires the named clock, random and wipe
    # tests. The conditional glibc 2.17 artefact is not offered until it is
    # qualified separately.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: docker.io/library/almalinux:8@sha256:34a85f19e05e28243249d45dd3842621741a43b110865ca80575c9b4e083cc29
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      NATIVE_TESTS: >-
        linux_clock::tests::read_clock_boot_advances_and_never_goes_back
        linux_clock::tests::read_clock_awake_advances_and_never_goes_back
        linux_random::tests::fill_random_fills_buffers_of_each_size_the_sheet_names
        linux_random::tests::getrandom_reports_a_full_piece_of_at_most_256_bytes
        mem_wipe::tests::wipe_zeroes_every_byte_of_every_length_from_0_to_257
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install a C toolchain and Rust
        run: |
          dnf --assumeyes install gcc
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs > rustup-init.sh
          sh rustup-init.sh -y --default-toolchain none --profile minimal
          "$HOME/.cargo/bin/rustup" toolchain install --profile minimal --no-self-update --no-update
      - name: Prove the runtime and the target
        run: |
          ldd --version | head -n 1
          ldd --version | head -n 1 | grep -q ' 2\.28$'
          test "$(uname -m)" = "$ARCH"
          "$HOME/.cargo/bin/rustc" -vV | grep -qx "host: $TARGET"
      - name: Run ironafs-os's tests on glibc 2.28, real system calls included
        run: |
          "$HOME/.cargo/bin/cargo" test -p ironafs-os --locked --target "$TARGET" > test.log 2>&1
          cat test.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' test.log
          for test in $NATIVE_TESTS; do
            grep -q "^test $test \.\.\. ok\$" test.log
          done

  miri:
    name: miri
    # The Miri job of coding standards rule 5, with the first crate that
    # holds unsafe (ADR 0005, point 6.5): each foreign call is replaced by
    # its in-crate stand-in, so the wrappers' own pointers and checks run
    # under Miri, and mem-wipe's own block.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly with Miri
        run: |
          rustup toolchain install nightly-2026-11-01 --profile minimal --component miri,rust-src --no-self-update
          cargo +nightly-2026-11-01 miri --version
      - name: Run ironafs-os under Miri, host and aarch64 Linux
        # A run that ran nothing, or ignored a test, proves nothing: each
        # must report every test passed and none ignored, and the named
        # wrapper and wipe tests must be among them. The random site passes
        # its buffer's exposed address, as the C call needs, so Miri runs
        # with permissive provenance, which only silences its warning about
        # that integer-to-pointer cast (the cast is the design, not a bug).
        env:
          MIRIFLAGS: -Zmiri-permissive-provenance
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            cargo +nightly-2026-11-01 miri test --locked -p ironafs-os --lib --target "$target" > "miri-$target.log" 2>&1
            cat "miri-$target.log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "miri-$target.log"
            for test in \
              linux_clock::tests::read_clock_boot_advances_and_never_goes_back \
              linux_random::tests::fill_random_fills_buffers_of_each_size_the_sheet_names \
              linux_random::tests::arguments_pass_the_buffer_address_and_length_and_zeros_each_as_a_long \
              mem_wipe::tests::wipe_zeroes_every_byte_of_every_length_from_0_to_257; do
              grep -q "^test $test \.\.\. ok$" "miri-$target.log"
            done
          done

  trailers:
    name: trailers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustc --version
          cargo --version
      - name: Check pull request trailers
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: cargo --locked xtask trailers pr
      - name: Check landed commit trailers
        if: github.event_name == 'push'
        run: cargo --locked xtask trailers main

  fuzz:
    name: fuzz (${{ matrix.runner }})
    # Fuzzing runs on Linux runners, on the fuzz crate's pinned nightly (ADR
    # 0004, O47, point 4). Pull requests replay the tracked seeds once; the
    # time-bounded fuzzing run is the scheduled job's. The engine's output is
    # never shown: a failure is reported by target and digest (O30).
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustc --version
          cargo --version
      - name: Install the fuzz crate's pinned nightly
        working-directory: fuzz
        run: |
          rustup toolchain install --profile minimal --no-self-update --no-update
          rustc --version
          cargo --version
      - name: Install cargo-fuzz
        run: |
          cargo install --locked --version =0.13.2 cargo-fuzz
          cargo fuzz --version
      - name: Check the fuzz crate's formatting
        working-directory: fuzz
        run: cargo fmt --check
      - name: Run Clippy on the fuzz crate
        working-directory: fuzz
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy --all-targets --locked
      - name: Replay every fuzz target's tracked seeds
        run: cargo --locked xtask fuzz

  ci-ok:
    name: ci-ok
    needs: [lint, test, os-linux, os-linux-glibc-2-28, miri, trailers, fuzz]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require lint, test, os-linux, glibc 2.28, Miri, trailer and fuzz check success
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          OS_LINUX_RESULT: ${{ needs.os-linux.result }}
          OLD_GLIBC_RESULT: ${{ needs.os-linux-glibc-2-28.result }}
          MIRI_RESULT: ${{ needs.miri.result }}
          TRAILERS_RESULT: ${{ needs.trailers.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          printf 'lint: %s\ntest: %s\nos-linux: %s\nglibc 2.28: %s\nmiri: %s\ntrailers: %s\nfuzz: %s\n' "$LINT_RESULT" "$TEST_RESULT" "$OS_LINUX_RESULT" "$OLD_GLIBC_RESULT" "$MIRI_RESULT" "$TRAILERS_RESULT" "$FUZZ_RESULT"
          [[ "$LINT_RESULT" == success && "$TEST_RESULT" == success && "$OS_LINUX_RESULT" == success && "$OLD_GLIBC_RESULT" == success && "$MIRI_RESULT" == success && "$TRAILERS_RESULT" == success && "$FUZZ_RESULT" == success ]]
