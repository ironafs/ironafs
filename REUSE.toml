version = 1

# Files whose format cannot carry a header (generated, JSON, or front matter
# that must come first).
[[annotations]]
path = [
  "Cargo.lock",
  ".claude/settings.json",
  ".claude/skills/**/SKILL.md",
  ".github/pull_request_template.md",
  "crates/xtask/tests/fixtures/trailers/*.txt",
  "tests/inventory/*.txt",
]
precedence = "aggregate"
